<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Troca de Rostos</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1d1b2e;--ac:#6c4cf1;--mu:#7a7790}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--card:#201d33;--tx:#f1effa;--mu:#a29fbb}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:14px;max-width:560px;margin:auto}
h1{font-size:1.3rem;margin:6px 0 2px}
.sub{color:var(--mu);font-size:.85rem;margin-bottom:12px}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px}
.card h2{font-size:.95rem;margin:0 0 8px}
.box{min-height:140px;border:2px dashed var(--mu);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.box img,.box video,.box canvas{max-width:100%;max-height:340px;display:block}
.box input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.hint{color:var(--mu);font-size:.85rem;text-align:center;padding:10px}
button,.dl{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1rem;font-weight:600;margin-top:8px;text-align:center;display:block;text-decoration:none}
button:disabled{opacity:.5}
#st{font-size:.85rem;color:var(--mu);margin:6px 0;min-height:1.2em}
.note{font-size:.75rem;color:var(--mu);text-align:center}
</style>
</head>
<body>
<h1>🎭 Troca de Rostos</h1>
<div class="sub">Criatividade e humor. Use só fotos de quem concordou.</di
